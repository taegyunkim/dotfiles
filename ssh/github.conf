# GitHub host routing for the commercial (taegyunkim, DataDog org) and EMU
# (taegyun-kim_ddog, ddoghq orgs) accounts. GitHub maps an SSH key to exactly
# one account, so each host offers only that account's key. ddoghq URLs are
# rewritten to the ddoghq.github.com alias by git/gitconfig-github.
#
# Included from the top of ~/.ssh/config by create_symlinks.sh, so these
# values win over later `Host *` blocks (first value obtained wins).
#
# IdentityFile order: the private key under ~/.ssh when present (Mac), then
# the public key in dotfiles, which makes ssh ask the agent for the private
# half (workspaces, through agent forwarding). Missing files are skipped.
#
# ControlPath uses %n (the alias as typed), not only %h (resolved to
# github.com), so the two aliases never share a multiplexed connection.

Host github.com
  IdentitiesOnly yes
  IdentityFile ~/.ssh/id_ed25519
  IdentityFile ~/.dotfiles/ssh/pubkeys/github-taegyunkim.pub
  ControlMaster auto
  ControlPath /tmp/ssh-mux-%n-%r@%h:%p
  ControlPersist 600

Host ddoghq.github.com
  HostName github.com
  IdentitiesOnly yes
  IdentityFile ~/.ssh/id_ed25519_gh_enterprise
  IdentityFile ~/.dotfiles/ssh/pubkeys/github-taegyun-kim_ddog.pub
  ControlMaster auto
  ControlPath /tmp/ssh-mux-%n-%r@%h:%p
  ControlPersist 600
